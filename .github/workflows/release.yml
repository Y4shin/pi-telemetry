name: Release

# Tag-triggered publish. Pushing a `vX.Y.Z` tag is the explicit consent to
# release: a plain merge to main publishes nothing. The tag is checked against
# package.json before anything reaches the registry, so a mistyped tag fails
# the job instead of publishing the wrong version.
#
# Auth is npm Trusted Publishing (OIDC): there is no NPM_TOKEN secret anywhere.
# npm verifies that the request came from this repository's release.yml, so the
# package must first be registered as a Trusted Publisher on npmjs.com; that
# registration only works once the package exists, which is why the very first
# version is published by hand:
#
#   1. npm login
#   2. npm publish --access public
#   3. on npmjs.com: package settings, Trusted publishing, add GitHub Actions
#      with owner `Y4shin`, repository `pi-telemetry`, workflow `release.yml`,
#      no environment, and both allowed-action boxes left unticked
#
# This job STAGES the release; it cannot make a version live. The trusted
# publisher is registered without the `npm publish` permission, so the only
# publishing call available to it is `npm stage publish`. A maintainer then
# approves the staged version with 2FA, which is what puts it on the registry.
# OIDC supports `npm publish`, `npm stage publish`, and dist-tags, but not
# `stage approve`, so the approval cannot be automated away here.
#
# Local flow (./scripts/release.sh does steps 2 to 5):
#   1. accumulate `.changeset/*.md` entries in normal commits
#   2. `npm run version`        # bumps package.json, writes CHANGELOG.md
#   3. commit the bump and CHANGELOG.md
#   4. tag `vX.Y.Z`
#   5. push the commit and the tag; this workflow verifies and stages
#   6. approve the staged version with 2FA (npmjs.com, or npm stage approve)

on:
  push:
    tags:
      - "v*"

# Least privilege: the job reads the repo, and id-token: write is what makes
# the OIDC exchange with npm possible. No contents: write, because this
# workflow creates no tags and pushes no commits.
permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify and stage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Test
        run: npm test

      - name: Check the tag matches the package version
        id: pkg
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi
          echo "Staging $name@$version"

      - name: Inspect the tarball
        run: npm pack --dry-run

      - name: Stage the release for approval
        # Staging, not publishing: the trusted publisher has no `npm publish`
        # permission, and a maintainer's 2FA approval is what makes the version
        # live. A version already on the registry is not an error, so a re-run
        # after a partial failure stays safe.
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          set -euo pipefail
          spec="${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }}"
          if npm view "$spec" version >/dev/null 2>&1; then
            echo "$spec is already published; nothing to stage."
            exit 0
          fi
          npm stage publish
          {
            echo "### $spec is staged, not live"
            echo
            echo "Approve it with 2FA to publish:"
            echo
            echo '```'
            echo "npm stage list ${{ steps.pkg.outputs.name }}"
            echo "npm stage approve <stage-id>"
            echo '```'
            echo
            echo "Or approve it under the Staged Packages tab of"
            echo "<https://www.npmjs.com/package/${{ steps.pkg.outputs.name }}>."
          } >> "$GITHUB_STEP_SUMMARY"
