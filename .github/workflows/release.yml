name: Release

# Tag-triggered release. Pushing a `vX.Y.Z` tag is the explicit consent to
# release: a plain merge to main releases nothing. The tag is checked against
# package.json before anything reaches the registry.
#
# Two jobs, split by privilege:
#
#   build  runs the repository's code: install, typecheck, tests, pack. It has
#          no id-token and cannot publish, so a dependency's install script
#          reaching into this job finds nothing worth stealing.
#   stage  never checks out the repository and runs no install scripts. It
#          downloads the tarball the build job produced, checks that its
#          package.json agrees with the tag, and stages exactly that file with
#          `npm stage publish <tarball>`.
#
# Auth is npm Trusted Publishing (OIDC): there is no NPM_TOKEN secret anywhere.
# npm verifies that the request came from this repository's release.yml, so the
# package must first be registered as a Trusted Publisher on npmjs.com; that
# registration only works once the package exists, which is why the very first
# version is published by hand:
#
#   1. npm login
#   2. npm publish --access public
#   3. on npmjs.com: package settings, Trusted publishing, add GitHub Actions
#      with owner `Y4shin`, repository `pi-telemetry`, workflow `release.yml`,
#      no environment, and both allowed-action boxes left unticked
#
# This workflow STAGES the release; it cannot make a version live. The trusted
# publisher is registered without the `npm publish` permission, so the only
# publishing call available to it is `npm stage publish`. A maintainer then
# approves the staged version with 2FA, which is what puts it on the registry.
#
# Workflow integrity: the build job compares .github/workflows/ at the tagged
# commit with origin/main. A tag that carries a modified pipeline fails here,
# so a swapped workflow has to land on main first, in the open. This is
# detection, not a boundary; the file it checks lives in the repository it
# releases.
#
# Local flow (./scripts/release.sh does steps 2 to 5, and refuses any branch
# but main):
#   1. accumulate `.changeset/*.md` entries in normal commits
#   2. `npm run version`        # bumps package.json, writes CHANGELOG.md
#   3. commit the bump and CHANGELOG.md
#   4. tag `vX.Y.Z`
#   5. push the commit and the tag; this workflow verifies and stages
#   6. approve the staged version with 2FA (npmjs.com, or npm stage approve)

on:
  push:
    tags:
      - "v*"

# Default deny for the whole workflow; the stage job asks for id-token only.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify and pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      name: ${{ steps.pkg.outputs.name }}
      version: ${{ steps.pkg.outputs.version }}
    steps:
      # Pinned to the commit behind v4.4.0: a moved tag cannot change what runs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Test
        run: npm test

      - name: Check the tag matches the package version
        id: pkg
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi
          echo "Staging $name@$version"

      - name: Check the pipeline is the one main has
        # A tag can point at any commit, and a push event runs the workflow
        # found on that commit. Diff the pipeline against main: a tag that
        # ships a different release.yml fails here instead of staging quietly.
        run: |
          set -euo pipefail
          if ! git rev-parse -q --verify origin/main >/dev/null; then
            echo "::error::origin/main is not available; cannot check the pipeline"
            exit 1
          fi
          if git diff --quiet origin/main -- .github/workflows/; then
            echo "The release pipeline matches main."
          else
            echo "::error::the tagged commit changes .github/workflows/ and main does not have those changes"
            git diff --stat origin/main -- .github/workflows/ || true
            exit 1
          fi

      - name: Pack the release
        # npm pack needs the destination directory to exist already.
        run: |
          mkdir -p dist
          npm pack --pack-destination dist

      - name: Upload the tarball for the stage job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-tarball
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 7

  stage:
    name: Stage for approval
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # the OIDC exchange with npm; nothing else needs it
    env:
      EXPECTED_NAME: ${{ needs.build.outputs.name }}
      EXPECTED_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Download the tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-tarball
          path: dist

      - name: Check the tarball is the release the tag names
        # The artifact comes from another job, so verify it rather than trust
        # it: the name and version inside must be the ones the build job
        # checked against the tag.
        run: |
          set -euo pipefail
          tarball="$(ls dist/*.tgz)"
          echo "Tarball: $tarball"
          sha256sum "$tarball"
          mkdir -p unpacked
          tar xzf "$tarball" -C unpacked
          name=$(node -p "require('./unpacked/package/package.json').name")
          version=$(node -p "require('./unpacked/package/package.json').version")
          echo "Contents: $name@$version"
          if [ "$name" != "$EXPECTED_NAME" ] || [ "$version" != "$EXPECTED_VERSION" ]; then
            echo "::error::the tarball is $name@$version but the tag names $EXPECTED_NAME@$EXPECTED_VERSION"
            exit 1
          fi

      - name: Stage the release for approval
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          set -euo pipefail
          spec="$EXPECTED_NAME@$EXPECTED_VERSION"
          if npm view "$spec" version >/dev/null 2>&1; then
            echo "$spec is already published; nothing to stage."
            exit 0
          fi
          npm stage publish dist/*.tgz
          {
            echo "### $spec is staged, not live"
            echo
            echo "The staged artifact is the tarball this run packed, sha256sum above."
            echo "Approve it with 2FA:"
            echo
            echo '```'
            echo "npm stage list $EXPECTED_NAME"
            echo "npm stage approve <stage-id>"
            echo '```'
            echo
            echo "Or approve it under the Staged Packages tab of"
            echo "<https://www.npmjs.com/package/$EXPECTED_NAME>."
          } >> "$GITHUB_STEP_SUMMARY"
